name: Aggregate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# No schedule. No dataset download. Manuscript compile is skipped here
# because article.tex is not in this warehouse.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No dataset download in CI YAML
        run: scripts/check-no-download.sh

      - name: Privacy gate (tracked + worktree)
        run: |
          scripts/check-no-pii.sh --tracked
          scripts/check-no-pii.sh --worktree

      - name: Locked numbers (35978f2 manuscript SSOT)
        run: python3 scripts/check-locked-numbers.py

      - name: Source hashes
        run: python3 scripts/check-source-hashes.py

      - name: Aggregate JSON not stale
        run: python3 scripts/build_aggregates.py --check

      - name: Manuscript compile smoke
        run: |
          if [ -f article.tex ] || [ -f RejectedManuscript/00_CURRENT_VERSION/article.tex ]; then
            echo "article.tex present but this job has no TeX live; failing closed rather than claiming compile."
            exit 1
          fi
          echo "SKIP manuscript compile: article.tex is not in heat-sperm-portal (SSOT is Vector git 35978f2)."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Static export
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Export is aggregate-only
        run: |
          if find web/out \( -iname '*harmonized*' -o -iname 'donor_exposure*' -o -iname 'xiamen_exposure*' -o -iname '*.xlsx' -o -iname '*.xls' \) | grep -q .; then
            echo "blocked: donor-named or spreadsheet files in web/out"
            exit 1
          fi
          test -f web/out/index.html
          test -f web/out/data/manifest.json
          test -f web/out/data/baseline_table.json
          python3 scripts/check-locked-numbers.py

name: Build static export

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# No schedule. Artifact is the Next.js static export of aggregate JSON only.
# Dataset downloads are forbidden. Deploy is fail-closed: it runs only when
# the repository variable ENABLE_PAGES is the string "true". Unset means skip.

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No dataset download
        run: scripts/check-no-download.sh

      - name: Privacy gate (working tree)
        run: scripts/check-no-pii.sh --worktree

      - name: Locked numbers
        run: python3 scripts/check-locked-numbers.py

      - name: Source hashes
        run: python3 scripts/check-source-hashes.py

      - name: Aggregate JSON not stale
        run: python3 scripts/build_aggregates.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Pages base path
        id: base
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          if [[ "$name" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${name}" >> "$GITHUB_OUTPUT"
          fi

      - name: Static export
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Confirm export is aggregate-only
        run: |
          if find web/out \( -iname '*harmonized*' -o -iname 'donor_exposure*' -o -iname 'xiamen_exposure*' -o -iname '*.xlsx' -o -iname '*.xls' \) | grep -q .; then
            echo "blocked: donor-named or spreadsheet files in web/out"
            exit 1
          fi
          test -f web/out/index.html
          test -f web/out/data/manifest.json

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
